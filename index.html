<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="monetag" content="da0d80a5c ebbd2aa5575234d8507b148">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAM 69</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fff5f7;
            color: #1e293b;
            overflow-x: hidden;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .glass {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(236, 72, 153, 0.2);
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.08);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(236, 72, 153, 0.15);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Top Header -->
    <header class="w-full py-6 px-4 text-center relative z-20">
        <div class="inline-block relative">
            <h1 class="text-6xl sm:text-7xl font-black uppercase tracking-widest text-transparent select-none opacity-20 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="-webkit-text-stroke: 2px #ec4899; z-index: 1;">
                VIP
            </h1>
            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-800 relative" style="z-index: 10; text-shadow: 0 4px 20px rgba(236,72,153,0.2);">
                STREAM <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-500">69</span>
            </h2>
        </div>
        <p class="text-xs sm:text-sm text-pink-600/80 mt-2 font-medium">Pilih video favorit Anda</p>
    </header>

    <!-- Main Container with 3D Flip Card -->
    <main class="flex-grow flex items-center justify-center px-4 pb-12">
        <div id="cardContainer" class="w-full max-w-md perspective-1000 transition-transform duration-700">
            <div id="cardInner" class="relative w-full transform-style-3d duration-700 shadow-2xl rounded-3xl">

                <!-- FRONT SIDE: Dashboard Gallery -->
                <div class="backface-hidden glass rounded-3xl p-5 flex flex-col gap-4 shadow-xl">
                    
                    <!-- Search Box -->
                    <div class="relative flex items-center">
                        <input type="text" id="searchInput" placeholder="Cari video atau artis..." 
                            class="w-full bg-pink-50/70 border border-pink-200 rounded-2xl py-3 pl-4 pr-24 text-sm text-slate-800 placeholder-pink-300 focus:outline-none focus:border-pink-500 transition-all">
                        <button id="searchBtn" class="absolute right-1.5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md transition-all">
                            Cari
                        </button>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="categoryContainer">
                        <button class="cat-pill active-cat px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-500 text-white shadow-md transition-all shrink-0" data-cat="Semua">Semua</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-100 hover:bg-pink-200 text-pink-800 transition-all shrink-0" data-cat="Viral">Viral</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-100 hover:bg-pink-200 text-pink-800 transition-all shrink-0" data-cat="Janda">Janda</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-100 hover:bg-pink-200 text-pink-800 transition-all shrink-0" data-cat="ABG">ABG</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-100 hover:bg-pink-200 text-pink-800 transition-all shrink-0" data-cat="Jilbab">Jilbab</button>
                    </div>

                    <!-- Video Grid 2x3 -->
                    <div id="videoGrid" class="grid grid-cols-2 gap-3.5"></div>

                    <!-- Pagination Controls -->
                    <div id="paginationContainer" class="flex items-center justify-between pt-2 border-t border-pink-100 text-xs"></div>
                </div>

                <!-- BACK SIDE: Video Player (Style sesuai referensi gambar & In-Page Push Overlay) -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-3xl overflow-hidden flex flex-col bg-[#121212] shadow-2xl border border-pink-500/20">
                    
                    <!-- Top Bar Player -->
                    <div class="px-4 py-3 bg-[#1a1a1a] flex items-center justify-between border-b border-white/5">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
                            <span class="text-[11px] font-bold tracking-wider text-pink-400 uppercase">NOW PLAYING</span>
                        </div>
                        <button id="backToGalleryBtn" class="w-7 h-7 rounded-full bg-black/40 hover:bg-black text-white text-xs font-bold flex items-center justify-center border border-white/10 transition-all">
                            ✕
                        </button>
                    </div>

                    <!-- Center Area: Video Container + In-Page Push Overlay -->
                    <div class="relative w-full flex-grow bg-black flex flex-col items-center justify-center overflow-hidden">
                        
                        <!-- Iframe Video Embed -->
                        <iframe id="mainVideoPlayer" class="w-full h-full border-0" allowfullscreen></iframe>

                        <!-- IN-PAGE PUSH OVERLAY (Menutupi pemutar video, muncul tiap 20 detik setelah 8 detik awal) -->
                        <div id="inPagePushOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md z-40 flex flex-col items-center justify-center p-5 text-center hidden transition-all duration-300">
                            <button id="closePushBtn" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white font-bold flex items-center justify-center transition-all">
                                ✕
                            </button>
                            <div class="max-w-xs space-y-3 cursor-pointer" onclick="triggerSmartlink()">
                                <div class="w-12 h-12 rounded-full bg-pink-500/20 border border-pink-500/40 mx-auto flex items-center justify-center text-pink-400 text-xl font-bold">
                                    ▶
                                </div>
                                <h4 class="text-white font-bold text-sm leading-snug">Lanjutkan Menonton Video Full HD & Unduh File</h4>
                                <p class="text-slate-400 text-xs">Ketuk tombol di bawah untuk membuka pemutar kualitas tinggi tanpa batas.</p>
                                <div class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-extrabold text-xs py-2.5 px-4 rounded-xl shadow-lg transition-all inline-block">
                                    ► Watch Full HD / Download
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Bottom Details like Reference Image -->
                    <div class="p-4 bg-[#161616] border-t border-white/5 flex flex-col gap-2.5">
                        <div class="flex items-center justify-between">
                            <span id="playerVideoTitle" class="text-xs font-bold text-white line-clamp-1">Judul Video</span>
                            <span class="bg-pink-500/10 text-pink-400 border border-pink-500/20 text-[10px] px-2 py-0.5 rounded-md font-semibold">New</span>
                        </div>
                        <div class="flex items-center justify-between text-[11px] text-slate-400">
                            <span>My Videos Official</span>
                        </div>
                        <button onclick="triggerSmartlink()" class="w-full mt-1 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-1.5">
                            <span>▶ Watch Full HD / Download</span>
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-pink-400 border-t border-pink-100 bg-white">
        &copy; 2026 STREAM 69. All rights reserved.
    </footer>

    <script>
        // Smartlink URLs
        const smartlinks = [
            "https://uplcm.com/4/11744117",
            "https://uplcm.com/4/11744117"
        ];
        let smartlinkIndex = 0;

        function triggerSmartlink() {
            let url = smartlinks[smartlinkIndex];
            smartlinkIndex = (smartlinkIndex + 1) % smartlinks.length;
            window.open(url, '_blank');
        }

        // Database Video
        const videosData = [
            { id: 1, title: "Sentuhan Hangat di Malam Romantis", video: "https://vidara.to/e/N7Un3kbsciOzH", gambar: "https://i.ibb.co/S7RdW6JF/1794386708126.jpg", durasi: "5:21", cat: "Viral" },
            { id: 2, title: "Pesona Menggoda Penuh Gairah", video: "https://vidara.to/e/KtPxbE0hOmfzl", gambar: "https://i.ibb.co/JW1dXfxr/1794386703660.jpg", durasi: "8:18", cat: "Janda" },
            { id: 3, title: "Koleksi Eksklusif Menggoda Iman", video: "https://vidara.to/e/Bp8GQHkntU9AQ", gambar: "https://i.ibb.co/qLZPNVxJ/1794386683835.jpg", durasi: "7:58", cat: "Janda" },
            { id: 4, title: "Senyuman Manis Bikin Penasaran", video: "https://vidara.to/e/NkmjypTCqpeum", gambar: "https://i.ibb.co/gZfCyhQT/1794386755498.jpg", durasi: "8:06", cat: "ABG" },
            { id: 5, title: "Momen Spesial Tanpa Batas", video: "https://vidara.to/e/gSNeO0zkj1Xse", gambar: "https://i.ibb.co/6J7SkhCx/1794386609310.jpg", durasi: "4:47", cat: "Viral" },
            { id: 6, title: "Kejutan Manis Malam Ini", video: "https://vidara.to/e/y7PmRCBmooVBe", gambar: "https://i.ibb.co/6J7SkhCx/1794386609310.jpg", durasi: "1:23", cat: "Viral" },
            { id: 7, title: "Aksi Seru Penuh Kejutan Panas", video: "https://vidara.to/e/4yuXW0VHFuQ2T", gambar: "https://i.ibb.co/nM2Y2n0H/1794386585135.jpg", durasi: "3:20", cat: "Janda" },
            { id: 8, title: "Gadis Manis Berbakat Spesial", video: "https://vidara.to/e/PmHc8bLBhiNX0", gambar: "https://i.ibb.co/FLBf5wY7/1794386512217.jpg", durasi: "2:28", cat: "ABG" },
            { id: 9, title: "Pesona Anggun Mempesona", video: "https://vidara.to/e/EaKANfgk1cocD", gambar: "https://i.ibb.co/FbmYh1tr/1794386070183.jpg", durasi: "5:52", cat: "Jilbab" },
            { id: 10, title: "Kecantikan Alami Bikin Terpikat", video: "https://vidara.to/e/H9ovmfjLWzHaE", gambar: "https://i.ibb.co/ns8XZNpx/1794386244834.jpg", durasi: "9:33", cat: "Jilbab" }
        ];

        let currentPage = 1;
        const itemsPerPage = 6;
        let currentCategory = "Semua";
        let searchQuery = "";
        let pushTimer = null;

        const videoGrid = document.getElementById('videoGrid');
        const paginationContainer = document.getElementById('paginationContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const cardContainer = document.getElementById('cardContainer');
        const cardInner = document.getElementById('cardInner');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const playerVideoTitle = document.getElementById('playerVideoTitle');
        const backToGalleryBtn = document.getElementById('backToGalleryBtn');
        const inPagePushOverlay = document.getElementById('inPagePushOverlay');
        const closePushBtn = document.getElementById('closePushBtn');

        // Render Gallery Grid
        function renderGallery() {
            let filtered = videosData.filter(item => {
                let matchCat = currentCategory === "Semua" || item.cat === currentCategory;
                let matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            let totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            let start = (currentPage - 1) * itemsPerPage;
            let paginatedItems = filtered.slice(start, start + itemsPerPage);

            videoGrid.innerHTML = "";
            paginatedItems.forEach(item => {
                let card = document.createElement('div');
                card.className = "group relative aspect-[3/4] rounded-2xl overflow-hidden glass-card cursor-pointer shadow-lg hover:border-pink-500/50 transition-all duration-300";
                card.innerHTML = `
                    <img src="${item.gambar}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-2.5">
                        <span class="text-[10px] font-mono text-pink-400 font-semibold mb-0.5">${item.durasi}</span>
                        <h3 class="text-xs font-bold text-white line-clamp-2 leading-snug">${item.title}</h3>
                    </div>
                `;
                card.addEventListener('click', () => {
                    triggerSmartlink();
                    openPlayer(item);
                });
                videoGrid.appendChild(card);
            });

            paginationContainer.innerHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="text-pink-300 cursor-not-allowed px-2 py-1"' : 'class="text-pink-600 hover:text-pink-800 px-2 py-1 font-semibold"'}>Prev</button>
                <span class="text-pink-700 font-medium">Hal ${currentPage} dari ${totalPages}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled class="text-pink-300 cursor-not-allowed px-2 py-1"' : 'class="text-pink-600 hover:text-pink-800 px-2 py-1 font-semibold"'}>Next</button>
            `;
        }

        function changePage(page) {
            let filtered = videosData.filter(item => {
                let matchCat = currentCategory === "Semua" || item.cat === currentCategory;
                let matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });
            let totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderGallery();
            }
        }

        // Category Filter
        document.querySelectorAll('.cat-pill').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-pill').forEach(b => {
                    b.classList.remove('bg-pink-500', 'text-white', 'shadow-md');
                    b.classList.add('bg-pink-100', 'text-pink-800');
                });
                e.target.classList.remove('bg-pink-100', 'text-pink-800');
                e.target.classList.add('bg-pink-500', 'text-white', 'shadow-md');
                currentCategory = e.target.getAttribute('data-cat');
                currentPage = 1;
                renderGallery();
            });
        });

        // Search Handlers
        searchBtn.addEventListener('click', () => {
            searchQuery = searchInput.value.trim();
            currentPage = 1;
            renderGallery();
        });
        searchInput.addEventListener('keyup', (e) => {
            searchQuery = searchInput.value.trim();
            currentPage = 1;
            renderGallery();
        });

        // Open Player & Flip 180 deg + Start Push Timer (8s initial, then every 20s)
        function openPlayer(item) {
            cardInner.classList.add('rotate-y-180');
            mainVideoPlayer.src = item.video;
            playerVideoTitle.textContent = item.title;
            inPagePushOverlay.classList.add('hidden');

            // Clear previous interval if any
            if (pushTimer) clearInterval(pushTimer);

            // Muncul pertama kali setelah 8 detik
            setTimeout(() => {
                if (cardInner.classList.contains('rotate-y-180')) {
                    inPagePushOverlay.classList.remove('hidden');
                }
            }, 8000);

            // Lalu berulang muncul setiap 20 detik
            pushTimer = setInterval(() => {
                if (cardInner.classList.contains('rotate-y-180')) {
                    inPagePushOverlay.classList.remove('hidden');
                }
            }, 20000);
        }

        // Close In-Page Push Overlay via (x) button + trigger smartlink
        closePushBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerSmartlink();
            inPagePushOverlay.classList.add('hidden');
        });

        // Close Player & Flip Back
        backToGalleryBtn.addEventListener('click', () => {
            cardInner.classList.remove('rotate-y-180');
            mainVideoPlayer.src = "";
            inPagePushOverlay.classList.add('hidden');
            if (pushTimer) clearInterval(pushTimer);
        });

        renderGallery();
    </script>
</body>
</html>
